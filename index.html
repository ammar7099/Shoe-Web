<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid px-4 py-3">



        <nav class="navbar bg-white border border-3 border-dark rounded p-3">
            <div class="container-fluid">

                <form id="filterForm" class="row g-3 align-items-center w-100">

                    <!-- Brand -->
                    <div class="col-6 col-md">
                        <select id="brandFilter" class="form-select">
                            <option value="">Brand</option>
                            <option value="adidas">Adidas</option>
                            <option value="nike">Nike</option>
                            <option value="puma">Puma</option>
                            <option value="reebok">Reebok</option>
                        </select>
                    </div>

                    <!-- Color -->
                    <div class="col-6 col-md">
                        <select id="colorFilter" class="form-select">
                            <option value="">Color</option>
                            <option value="black">Black</option>
                            <option value="white">White</option>
                            <option value="red">Red</option>
                            <option value="blue">Blue</option>
                        </select>
                    </div>

                    <!-- Size -->
                    <div class="col-6 col-md">
                        <select id="sizeFilter" class="form-select">
                            <option value="">Size</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                        </select>
                    </div>

                    <!-- Price -->
                    <div class="col-6 col-md">
                        <select id="priceFilter" class="form-select">
                            <option value="">Price</option>
                            <option value="0-3000">Under Rs. 3,000</option>
                            <option value="3000-5000">Rs. 3,000 - 5,000</option>
                            <option value="5000-7000">Rs. 5,000 - 7,000</option>
                            <option value="7000+">Rs. 7,000+</option>
                        </select>
                    </div>

                    <!-- Search -->
                    <div class="col-12 col-md-4">
                        <div class="input-group">
                            <input type="search" id="searchInput" class="form-control" placeholder="Search shoes...">

                            <button type="submit" class="btn btn-dark">
                                SEARCH
                            </button>
                        </div>
                    </div>

                </form>

            </div>
        </nav>


    </div>


    <div class="container-fluid px-3 px-md-4 my-4">

        

        <div id="productContainer" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">
        </div>

        <div id="noResults" class="text-center py-5 d-none">
            <h4>No shoes found!</h4>
            <p>Try changing your filters.</p>
        </div>

    </div>

    <script src="script.js"></script>


</body>

</html>
